[package]
name = "masslynx"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.25"
pretty_env_logger = "0.5.0"
regex = "1.11.1"


[workspace]

members = [".", "crates/masslynx-mzdata"]

[dev-dependencies]
clap = { version = "4.5.53", features = ["derive"] }
csv = "1.3.1"
mzpeaks = "1.0.9"
serde = { version = "1.0.219", features = ["derive"] }

[profile.release]
debug = true
